# Marketing site — marketing.ziricai.com
# Netlify dashboard: Base directory = marketing

[build]
  command = "cd .. && npm ci && node scripts/prepare-sites.js marketing"
  publish = "."

[build.environment]
  NETLIFY = "true"
  USE_CDN_FIREBASE = "true"
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://ziricai-production.up.railway.app/api/:splat"
  status = 200
  force = true

# Static assets must not SPA-fallback to index.html (missing CSS/JS looks unstyled).
[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 301

# Wave 1 pretty URLs — must appear before SPA fallback (Gate 1 acceptance).
[[redirects]]
  from = "/industry-automotive.html"
  to = "/solutions/automotive/"
  status = 301

[[redirects]]
  from = "/pricing"
  to = "/pricing/"
  status = 301

[[redirects]]
  from = "/platform"
  to = "/platform/"
  status = 301

[[redirects]]
  from = "/platform/whatsapp"
  to = "/platform/whatsapp/"
  status = 301

[[redirects]]
  from = "/platform/webchat"
  to = "/platform/webchat/"
  status = 301

[[redirects]]
  from = "/platforms"
  to = "/platform/"
  status = 301

[[redirects]]
  from = "/platforms/"
  to = "/platform/"
  status = 301

[[redirects]]
  from = "/platforms/whatsapp"
  to = "/platform/whatsapp/"
  status = 301

[[redirects]]
  from = "/platforms/whatsapp/"
  to = "/platform/whatsapp/"
  status = 301

[[redirects]]
  from = "/platforms/webchat"
  to = "/platform/webchat/"
  status = 301

[[redirects]]
  from = "/platforms/webchat/"
  to = "/platform/webchat/"
  status = 301

[[redirects]]
  from = "/solutions"
  to = "/solutions/"
  status = 301

[[redirects]]
  from = "/solutions/automotive"
  to = "/solutions/automotive/"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/resources/faq/"
  status = 301

[[redirects]]
  from = "/faq/"
  to = "/resources/faq/"
  status = 301

[[redirects]]
  from = "/resources/faq"
  to = "/resources/faq/"
  status = 301

# Home-only hash routes; physical paths (pricing/, platform/*) are served as static HTML first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[context.production.environment]
  # Empty = same-origin /api/* Netlify proxy to Railway (recommended).
  API_BASE_URL = ""
  MARKETING_BASE_URL = "https://marketing.ziricai.com"
  PUBLIC_WEB_URL = "https://ziricai.com"
  APP_BASE_URL = "https://app.ziricai.com"
  ADMIN_BASE_URL = "https://admin.ziricai.com"
