# Super admin console — admin.ziricai.com
# Netlify dashboard: Base directory = admin

[build]
  command = "cd .. && npm ci && node scripts/prepare-sites.js admin"
  publish = "."

[build.environment]
  NETLIFY = "true"
  USE_CDN_FIREBASE = "true"
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://ziricai-production.up.railway.app/api/:splat"
  status = 200
  force = true

# Never SPA-fallback node_modules — missing Firebase packages must 404 as JS, not return index.html.
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/firebase.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/users.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/admin-dashboard.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[context.production.environment]
  # Empty = same-origin /api/* Netlify proxy to Railway (recommended).
  API_BASE_URL = ""
  MARKETING_BASE_URL = "https://marketing.ziricai.com"
  APP_BASE_URL = "https://app.ziricai.com"
  ADMIN_BASE_URL = "https://admin.ziricai.com"
